[package]
name = "qinghe-core"
version = "0.3.0"
edition = "2021"
description = "Qinghe local ledger domain, import and storage engine"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
csv = "1"
calamine = { version = "0.31", features = ["chrono"] }
encoding_rs = "0.8"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
tempfile = "3"
